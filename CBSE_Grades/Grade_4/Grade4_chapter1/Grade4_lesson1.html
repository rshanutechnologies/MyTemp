<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Body Quiz Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Livvic", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      background: url("./assets/images/background.png") center / cover no-repeat;
    }
    .menu-overlay{
    position:fixed;
    inset:0;
    background:url("./assets/images/background.png") center/cover no-repeat;
    z-index:998;
    display:none;
}
.menu-overlay.active{
    display:block;
}

    /* ===== NAVIGATION AREA ===== */
    .top-index {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 100px;
      padding: 15px 0px;
     
      /* background: url("./assets/images/background.png") center / cover no-repeat; */
    }

    /* ===== BUTTON BASE ===== */
    .index-btn {
      width: 160px;
      height: 60px;
      border: none;
      background: none;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: .35s ease;
    }

    /* SVG */
    .body-svg {
      width: 100px;
      height: 85px;
      transition: .35s ease;
    }

    /* SVG colors */
    .index-btn:nth-of-type(1) .body-svg {
      fill: #ff9fba;
    }

    .index-btn:nth-of-type(2) .body-svg {
      fill: #7ccfff;
    }

    .index-btn:nth-of-type(3) .body-svg {
      fill: #ff006a;
    }

    .index-btn:nth-of-type(4) .body-svg {
      fill: #ffc107;
    }

    /* Hover SVG */
    .index-btn:hover .body-svg {
      transform: scale(1.30);
    }

    .nav-text {
      width: 200px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 20px;
      font-weight: 600;
      color: #2f3a4a;
      border: 3px solid transparent;
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, .85),
        inset 0 -4px 6px rgba(0, 0, 0, .08),
        0 8px 10px rgba(0, 0, 0, .18);
      transition: all .3s ease;
    }

    /* Different text background colors */
    .index-btn:nth-of-type(1) .nav-text {
      background: #ffb6d5;
    }

    .index-btn:nth-of-type(2) .nav-text {
      background: #a7f3d0;
    }

    .index-btn:nth-of-type(3) .nav-text {
      background: #fde68a;
    }

    .index-btn:nth-of-type(4) .nav-text {
      background: #c4b5fd;
    }

    .index-btn:hover {
      transform: translateY(-2px);
    }

    /* Active text style */
    .index-btn.active .nav-text {
      border-color: #fff;
      background-color: rgb(198, 255, 193);
    }

    /* Active SVG zoom effect */
    .index-btn.active .body-svg {
      transform: scale(1.4);
      transition: transform .3s ease;
    }

    /* ===== CONTENT ===== */
    .content {
      flex: 1;
      width: 100%;
      position: relative;  /* needed for z-index to work */
  z-index: 0;  
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .left-structure {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-right: 40px;
      margin-top: -1%;
    }

    .structure-title {
      font-size: 30px;
      font-weight: 700;
      color: #2f3a4a;
      margin-bottom: 10px;
      margin-top: 2%;
      margin-left: 15%;
    }

    .structure-img {
      width: 120px;
    }

    /* ===================================== */
    /* =========== MOBILE RESPONSIVE ======= */
    /* ===================================== */

    .mobile-toggle {
      display: none;
    }

    @media (max-width:900px) {

      body {
        background: url("./assets/images/background.png") center / cover no-repeat;
      }

      .top-index {
        gap: 32px;
        padding: 12px 10px;
        flex-wrap: nowrap;
        background: url("./assets/images/background.png") center / cover no-repeat;
      }

      .index-btn {
        width: 170px;
        height: 60px;
      }

      .nav-text {
        width: 170px;
        height: 70px;
        font-size: 16px;
        padding: 8px 10px;
      }

      .index-btn:hover .nav-text {
        transform: translateY(-1px);
      }

      .body-svg {
        width: 80px;
        height: 70px;
      }

      .content {
        width: 100%;
        height: 100%;
        position: relative;  /* needed for z-index to work */
  z-index: 0;  
      }

    }

    @media (max-width:1100px) {

      html,
      body {
        overflow: hidden !important;
      }

      body {
        background: url("./assets/images/background.png") center / cover no-repeat;
      }

      /* SHOW TOGGLE BUTTON */
      .mobile-toggle {
        display: block;
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 1000;
        background: #00cfff;
        color: #fff;
        font-size: 22px;
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 22px;
        cursor: pointer;
      }

      /* NAVIGATION PANEL */
      .top-index {
        position: fixed;
        top: 0;
        right: -100%;
        width: 75%;
        height: 100vh;
        /* background: url("./assets/images/background.png") center / cover no-repeat; */
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        gap: 25px;
        padding-top: 80px;
        margin-left: 0;
        box-shadow: -5px 0 20px rgba(0, 0, 0, .2);
        transition: .4s ease;
        z-index: 999;
      }

      .top-index.active {
        right: 0;
      }

      .index-btn {
        width: 100%;
        max-width: 200px;
        height: 60px;
        flex-direction: row;
        justify-content: flex-start;
        padding-left: 20px;
        gap: 20px;
      }

      .nav-text {
        width: 100%;
        height: 100%;
        justify-content: center;
        font-size: 16px;
      }

      .body-svg {
        width: 60px;
        height: 60px;
      }

      .content {
        height: 100vh;
      }

      .structure-title {
        font-size: 26px;
        font-weight: 700;
        margin: 10px 0;
        margin-left: 0;
        text-align: center;
      }

      .left-structure {
        margin: 0;
        align-items: center;
      }

      .structure-img {
        width: 110px;
        margin-bottom: 10px;
      }

    }

    /* ===================================== */
    /* ===== 1280px PURE SIZE UPGRADE ===== */
    /* ===================================== */

    @media (min-width: 1280px) {

      .top-index {
        gap: 140px;
        padding: 20px 0;
       
        /* background: url("./assets/images/background.png") center / cover no-repeat; */
      }

      .index-btn {
        width: 180px;
        height: 80px;
        gap: 25px;
      }

      .body-svg {
        width: 120px;
        height: 100px;
      }

      .nav-text {
        width: 300px;
        height: 180px !important;
        font-size: 30px;
        border-radius: 24px;
      }

      .index-btn:hover .body-svg {
        transform: scale(1.35);
      }

      .index-btn.active .body-svg {
        transform: scale(1.45);
      }

      .structure-title {
        font-size: 40px;
      }

      .structure-img {
        width: 160px;
      }

    }
  </style>
</head>

<body>
  <button class="mobile-toggle" id="menuToggle">☰</button>
  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="top-index">

    <!-- <div class="structure-title">Body Quiz</div> -->
    <!-- <div class="left-structure">
    <img src="./assets/images/CuteBaby.png" alt="Human Body" class="structure-img">
  </div> -->

    <!-- BUTTONS -->
    <button class="index-btn active" data-file="exercises/mcq.html">
      <span class="nav-text">📝Choose Option</span>
    </button>

    <button class="index-btn" data-file="exercises/fillblanks.html">
      <span class="nav-text"> ✍️ Fill the Blanks</span>
    </button>

    <button class="index-btn" data-file="exercises/true_false.html">
      <span class="nav-text">⚖️ True / False</span>
    </button>

  </div>

  <div class="content">
    <iframe id="quizFrame"></iframe>
  </div>

  <script>
    const iframe = document.getElementById("quizFrame");
    const buttons = document.querySelectorAll(".index-btn");
    const overlay = document.getElementById("menuOverlay");
    const toggle = document.getElementById("menuToggle");
    const menu = document.querySelector(".top-index");

toggle.addEventListener("click", () => {
    menu.classList.toggle("active");
    overlay.classList.toggle("active");
});

overlay.addEventListener("click", () => {
    menu.classList.remove("active");
    overlay.classList.remove("active");
});
buttons.forEach(btn => {
    btn.addEventListener("click", () => {
        menu.classList.remove("active");
        overlay.classList.remove("active");
    });
});

    iframe.src = buttons[0].dataset.file;

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        iframe.src = btn.dataset.file;
      });
    });

    // const toggle = document.getElementById("menuToggle");
    // const menu = document.querySelector(".top-index");

    // toggle.addEventListener("click", () => {
    //   menu.classList.toggle("active");
    // });

    // /* Close menu when clicking a button */
    // buttons.forEach(btn => {
    //   btn.addEventListener("click", () => {
    //     menu.classList.remove("active");
    //   });
    // });
  </script>

</body>

</html>
