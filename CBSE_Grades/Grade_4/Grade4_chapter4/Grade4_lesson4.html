<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nature's Path | Pastel Quiz Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;

    background-image:
    linear-gradient(
        rgba(255,255,255,0.2),
        rgba(255,255,255,0.2)
    ),
    url("assets/images/BG.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* subtle animated nature overlay */
body::before {
    /* content: "🌿 🍃 🌱"; */
    position: absolute;
    bottom: 10px;
    left: 20px;
    font-size: 42px;
    opacity: 0.12;
    pointer-events: none;
    white-space: pre;
    z-index: 0;
}

body::after {
    /* content: "🍂 🍁 🐞"; */
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 36px;
    opacity: 0.1;
    pointer-events: none;
    z-index: 0;
}

/* APP WRAPPER */
.app {
    display: flex;
    height: 100vh;
    width: 100%;
    position: relative;
    z-index: 2;
    /* backdrop-filter: blur(2px); */
}

/* ========= SIDEBAR (TABS) – PASTEL & MODERN ========= */
.sidebar {
    width: clamp(230px, 22vw, 300px);
    /* background: rgba(250, 251, 245, 0.75); */
    /* backdrop-filter: blur(12px); */
    /* border-radius: 0 32px 32px 0; */
    margin: 18px 0 18px 0;
    /* box-shadow: 8px 12px 28px rgba(0, 20, 10, 0.08); */
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    /* border-right: 1px solid rgba(140, 190, 140, 0.3); */
}

.path {
    display: flex;
    flex-direction: column;
    gap: 18px;
    height: 100%;
    justify-content: center;
}

/* Tab leaf buttons – pastel palette with unique soft hues */
.leaf {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    border-radius: 60px;
    background: #fef9e6;   /* warm pastel base */
    font-weight: 600;
    font-size: 16px;
    color: #2c5a2e;
    cursor: pointer;
    transition: all 0.25s ease-in-out;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    border: 1px solid rgba(130, 180, 110, 0.2);
    letter-spacing: -0.2px;
    height:100px
}

.leaf i {
    font-size: 1.45rem;
    width: 32px;
    text-align: center;
    transition: transform 0.2s ease;
     opacity: 0.6;
}

/* individual pastel variations (still soft & harmonious) */
.leaf:nth-child(1) { background: #fde9df; color: #9b6a4c; border-left: 5px solid #f3bc9b; }
.leaf:nth-child(2) { background: #fde9df; color: #9b6a4c; border-left: 5px solid #f3bc9b; }
.leaf:nth-child(3) { background: #fde9df; color: #9b6a4c; border-left: 5px solid #f3bc9b; }
.leaf:nth-child(4) { background: #fde9df; color: #9b6a4c; border-left: 5px solid #f3bc9b; }
.leaf:nth-child(5) { background: #fde9df; color: #9b6a4c; border-left: 5px solid #f3bc9b; }
/* .leaf:nth-child(2) { background: #e0f3e8; color: #2d6a4f; border-left: 5px solid #99d6b4; }
.leaf:nth-child(3) { background: #ffe5e5; color: #b35f5f; border-left: 5px solid #f5b0b0; }
.leaf:nth-child(4) { background: #e8f0fe; color: #4f6d9a; border-left: 5px solid #b7c9e2; }
.leaf:nth-child(5) { background: #f3e5f8; color: #8b5f9e; border-left: 5px solid #dcb8f0; } */

/* active state: fresh pastel gradient and lifted */
.leaf.active {
    background: linear-gradient(115deg, #fff2df, #ffe6d5);
    color: #3c6e3f;
    box-shadow: 0 12px 22px -8px rgba(100, 70, 40, 0.2);
    border-left-width: 6px;
    transform: translateX(6px) scale(1.02);
    border-color: #b5d3a0;
    opacity: 1;
}

.leaf.active i {
    transform: scale(1.07);
    color: #6c9e4a;
}

/* Hover effect (gentle rise + pastel glow) */
.leaf:hover {
    transform: translateY(-3px) translateX(3px);
    background: rgba(255, 250, 225, 0.95);
    box-shadow: 0 12px 20px -12px rgba(60, 40, 20, 0.25);
    border-left-color: #b9e0a2;
     opacity: 0.9;
}

/* MAIN IFRAME AREA */
.main {
    flex: 1;
    height: 100%;
    padding: 18px 24px 18px 20px;
}

iframe {
    width: 100%;
    height: 100%;
     border: none;
    outline: none;
    /* border-radius: 32px; */
    /* background: #ffffffde; */
    /* box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2); */
    /* backdrop-filter: blur(2px); */
    /* border: 1px solid rgba(255,245,215,0.7); */
    transition: all 0.2s;
}

/* ========== RESPONSIVE: MOBILE (hamburger + pastel offcanvas) ========== */
.menu-btn {
    display: none;
    position: fixed;
    bottom: auto;
    top: 5px;
    right: 14px;
    background: #fae3cf;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 40px;
    font-size: 24px;
    color: #5f8b5b;
    cursor: pointer;
    z-index: 5000;
    box-shadow: 0 10px 18px rgba(0,0,0,0.1);
    transition: all 0.2s;
    backdrop-filter: blur(8px);
    background: rgba(255, 241, 220, 0.9);
}

.menu-btn:hover {
    background: #fbefdb;
    transform: scale(1.02);
    color: #306844;
}

.offcanvas {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(140, 130, 110, 0.3);
    backdrop-filter: blur(5px);
    z-index: 4500;
}
.offcanvas.show{
    display:block;
}

.offcanvas-panel {
    position: absolute;
    right: 0;
    top: 0;
    width: min(280px, 75%);
    height: 100%;
    background: rgba(254, 250, 240, 0.98);
    backdrop-filter: blur(12px);
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    box-shadow: -8px 0 28px rgba(0, 0, 0, 0.1);
    border-radius: 28px 0 0 28px;
    padding-top: 70px;
}

.offcanvas.show .offcanvas-panel {
    transform: translateX(0);
}

/* offcanvas leaf styles (same pastel vibe) */
.offcanvas .leaf {
    width: 100%;
    border-radius: 48px;
    padding: 14px 20px;
    font-size: 1rem;
    background: #fff6ea;
    border-left: 5px solid #cfe4b0;
}

.offcanvas .leaf i {
    width: 32px;
}

.offcanvas .leaf.active {
    background: linear-gradient(100deg, #fff1e0, #ffe6cf);
    transform: translateX(4px);
    border-left-color: #aac78d;
}

@media (max-width: 900px) {
    .sidebar {
        display: none !important;
    }

    .menu-btn {
        display: flex !important;
        align-items: center;
        justify-content: center;
    }
}

/* small top notch phones */
@media (max-width: 480px) {
    .leaf {
        gap: 12px;
        font-size: 0.9rem;
        padding: 12px 16px;
    }
    .offcanvas-panel {
        padding-top: 50px;
        gap: 14px;
    }
}

/* ========== DESKTOP fine-tuning ========== */
@media (min-width: 901px) {
    
    .menu-btn {
        display: none;
    }
    .sidebar {
        display: flex;
    }
    .offcanvas {
        display: none !important;
    }
}

/* scrollbar hidden but functional */
::-webkit-scrollbar {
    width: 5px;
}
::-webkit-scrollbar-track {
    background: #ecf3e2;
    border-radius: 10px;
}
::-webkit-scrollbar-thumb {
    background: #b7cf9a;
    border-radius: 10px;
}
@media (min-width: 1920px) {

    .sidebar {
        width: 450px;
    }

    .leaf {
        font-size: 22px;
        padding: 24px 28px;
        height:120px;
    }

    .leaf i {
        font-size: 2.2rem;
    }
}
</style>
</head>
<body>

<button class="menu-btn" id="menuToggleBtn" aria-label="Menu">
    <i class="fas fa-bars"></i>
</button>

<div class="app">
    <!-- DESKTOP SIDEBAR : pastel tab navigation -->
    <div class="sidebar">
        <div class="path">
            <div class="leaf" data-index="0">
                <i class="fas fa-feather-alt"></i>
                <span>Choose Answer</span>
            </div>
            <div class="leaf" data-index="1">
                <i class="fas fa-pencil-alt"></i>
                <span>Fill The Blanks</span>
            </div>
            <div class="leaf" data-index="2">
                <i class="fas fa-check-double"></i>
                <span>True / False</span>
            </div>
            <div class="leaf" data-index="3">
                <i class="fas fa-puzzle-piece"></i>
                <span>Matching</span>
            </div>
            <div class="leaf" data-index="4">
                <i class="fas fa-seedling"></i>
                <span>Percentage & Uses</span>
            </div>
        </div>
    </div>

    <div class="main">
        <iframe id="quizFrame" title="Nature Quiz Content" src="./exercises/mcq.html"></iframe>
    </div>
</div>

<!-- MOBILE OFF CANVAS (pastel floating panel) -->
<div class="offcanvas" id="offcanvas">
    <div class="offcanvas-panel">
        <div class="leaf" data-mobile="0">
            <i class="fas fa-feather-alt"></i>
            <span>Choose Answer</span>
        </div>
        <div class="leaf" data-mobile="1">
            <i class="fas fa-pencil-alt"></i>
            <span>Fill The Blanks</span>
        </div>
        <div class="leaf" data-mobile="2">
            <i class="fas fa-check-double"></i>
            <span>True / False</span>
        </div>
        <div class="leaf" data-mobile="3">
            <i class="fas fa-puzzle-piece"></i>
            <span>Matching</span>
        </div>
        <div class="leaf" data-mobile="4">
            <i class="fas fa-seedling"></i>
            <span>Two Examples</span>
        </div>
    </div>
</div>

<script>
    // ---------- PAGE ROUTES ----------
    const pages = [
        "./exercises/mcq.html",
        "./exercises/FTB.html",
        "./exercises/true_false.html",
        "./exercises/matching.html",
        "./exercises/two_example.html"
    ];

    const frame = document.getElementById("quizFrame");
    
    // Helper: open specific tab index, update active classes (sidebar + offcanvas)
    function openPage(index) {
        if (!pages[index]) return;
        frame.src = pages[index];
        
        // Update desktop sidebar active class
        const desktopLeaves = document.querySelectorAll(".sidebar .leaf");
        desktopLeaves.forEach((leaf, i) => {
            if (i === index) {
                leaf.classList.add("active");
            } else {
                leaf.classList.remove("active");
            }
        });
        
        // Update mobile offcanvas active class
        const mobileLeaves = document.querySelectorAll(".offcanvas .leaf");
        mobileLeaves.forEach((leaf, i) => {
            if (i === index) {
                leaf.classList.add("active");
            } else {
                leaf.classList.remove("active");
            }
        });
        
        // optional: store current
        sessionStorage.setItem("lastQuizTab", index);
    }
    
    // attach event listeners to desktop tabs
    const desktopTabs = document.querySelectorAll(".sidebar .leaf");
    desktopTabs.forEach((tab) => {
        const idxAttr = tab.getAttribute("data-index");
        if (idxAttr !== null) {
            tab.addEventListener("click", (e) => {
                const index = parseInt(idxAttr, 10);
                openPage(index);
            });
        } else {
            // fallback: get from child index
            tab.addEventListener("click", (e) => {
                const parent = tab.parentElement;
                const all = Array.from(parent.children);
                const idx = all.indexOf(tab);
                if (idx !== -1) openPage(idx);
            });
        }
    });
    
    // make sure all desktop leaves have data-index (just in case)
    document.querySelectorAll(".sidebar .leaf").forEach((el, idx) => {
        if (!el.hasAttribute("data-index")) {
            el.setAttribute("data-index", idx);
        }
        // reattach to be safe
        el.removeEventListener("click", () => {});
        el.addEventListener("click", (e) => {
            const i = parseInt(el.getAttribute("data-index"), 10);
            if (!isNaN(i)) openPage(i);
        });
    });
    
    // ----- MOBILE MENU TOGGLE LOGIC (pastel offcanvas) -----
    const menuBtn = document.getElementById("menuToggleBtn");
    const offcanvasEl = document.getElementById("offcanvas");
    
    function toggleOffcanvas(show) {
        if (!offcanvasEl) return;
        if (show === undefined) {
            offcanvasEl.classList.toggle("show");
        } else if (show) {
            offcanvasEl.classList.add("show");
        } else {
            offcanvasEl.classList.remove("show");
        }
    }
    
    if (menuBtn) {
        menuBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleOffcanvas();
        });
    }
    
    // close offcanvas when tapping outside panel (overlay)
    if (offcanvasEl) {
        offcanvasEl.addEventListener("click", (e) => {
            if (e.target === offcanvasEl) {
                toggleOffcanvas(false);
            }
        });
    }
    
    // attach mobile leaf events (offcanvas panel)
    const mobileLeafs = document.querySelectorAll(".offcanvas .leaf");
    mobileLeafs.forEach((leaf, idx) => {
        leaf.setAttribute("data-mobile", idx);
        leaf.addEventListener("click", (e) => {
            e.stopPropagation();
            const index = parseInt(leaf.getAttribute("data-mobile"), 10);
            if (!isNaN(index)) {
                openPage(index);
                // after opening page, close offcanvas on mobile
                if (window.innerWidth <= 900) {
                    toggleOffcanvas(false);
                }
            }
        });
    });
    
    // if any window resize above 900 and offcanvas stuck open -> close
    window.addEventListener("resize", () => {
        if (window.innerWidth > 900 && offcanvasEl) {
            offcanvasEl.classList.remove("show");
        }
    });
    
    // set default active tab: if there is no active yet, set first active
    function setInitialActive() {
        const saved = sessionStorage.getItem("lastQuizTab");
        let startIdx = 0;
        if (saved !== null && !isNaN(parseInt(saved,10))) {
            startIdx = parseInt(saved,10);
            if (startIdx >=0 && startIdx < pages.length) {
                openPage(startIdx);
                return;
            }
        }
        // otherwise default first tab
        openPage(0);
    }
    
    // minor fix: ensure both active classes init
    setInitialActive();
    
    // also handle the case when iframe maybe reload due to missing files; but still styling clean
    // optional: graceful error if 404, but UI remains intact.
    
    // final: hover effects & pastel tones already in css, plus responsive side
    // additional micro interaction to make tabs even more playful
    const allLeaves = document.querySelectorAll(".leaf");
    allLeaves.forEach(leaf => {
        leaf.addEventListener("mouseenter", (e) => {
            const icon = leaf.querySelector("i");
            if (icon) icon.style.transform = "rotate(2deg) scale(1.03)";
        });
        leaf.addEventListener("mouseleave", (e) => {
            const icon = leaf.querySelector("i");
            if (icon) icon.style.transform = "";
        });
    });
    
    // Also handle the scenario that the default iframe might load blank if exercises paths not existing (style safety)
    // but we trust the folder structure. For demo, fallback console.
    window.addEventListener("load", () => {
        // add robust active style update if some external link tries to modify
        const currentSrc = frame.src;
        const currentIdx = pages.findIndex(p => currentSrc.includes(p.replace("./","")) || currentSrc.endsWith(p));
        if (currentIdx !== -1) {
            openPage(currentIdx);
        }
    });
</script>
</body>
</html>
