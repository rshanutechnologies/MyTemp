<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grade3 Lesson4</title>

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">


  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Livvic';
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #d9e7f5;
      overflow: hidden;
      position: relative;
    }

    /* Background */

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background-image: url("images/3-41.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      filter: blur(3px);
      z-index: -1;
    }

    /* Laptop */
    .wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      /* 🔥 center horizontally */
      align-items: center;
    }

    .laptop {
      width: 1000px;
      height: 500px;
      background: #2e4f6d;
      border-radius: 30px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
      margin: 0 auto;
    }

    .screen {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 20px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ================= */
    /* DESKTOP MENU */
    /* ================= */

    .quiz-menu {
      position: absolute;
      left: -50px;
      top: 110px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-btn {
      width: 170px;
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      padding-left: 15px;
      gap: 10px;

      font-size: 18px;
      font-weight: 600;

      border-radius: 18px;
      cursor: pointer;
      position: relative;
      transition: .25s;
    }

    .icon {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;

      border-radius: 50%;

      background: rgba(223, 220, 220, 0.7);

      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.12),
        inset 0 1px 3px rgba(255, 255, 255, 0.8);

      margin-right: 10px;

      flex-shrink: 0;
    }

    .quiz-btn.active .icon {
      background: white;
      transform: scale(1.1);

      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.6),
        0 0 10px rgba(0, 0, 0, 0.15);
    }

    /* tab arrow */

    .quiz-btn::before {
      content: "";
      position: absolute;
      right: -28px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;

      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-left: 28px solid;
    }


    /* Colors */
    .quiz-btn {
      background: #f3e0ea;
      /* Pastel Blue */
      color: #4a5568;

      box-shadow:
        0 6px 0 rgba(0, 0, 0, .12),
        0 14px 20px rgba(0, 0, 0, .08);
    }

    .quiz-btn::before {
      border-left-color: #f3e0ea;
    }

    .quiz-btn.active {
      background: #DDF7D8;
      /* Pastel Lavender */
      outline: 4px solid white;
      transform: scale(1.08);
    }

    .quiz-btn.active::before {
      border-left-color: #DDF7D8;
    }

    /* ================= */
    /* MOBILE MENU */
    /* ================= */

    .menu-toggle {
      display: none;
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 22px;
      font-size: 22px;
      background: #5AC85A;
      font-weight: 600;
      color: black;
      padding: 6px 12px;
      cursor: pointer;
      z-index: 1000;
      border-radius: 18px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, .3);
      border: none;
    }

    /* ================= */
    /* MOBILE RESPONSIVE */
    /* ================= */

    @media(max-width:600px) {

      body {
        overflow: auto;
        align-items: flex-start;
        padding-top: 60px;
      }

      /* hamburger visible */
      .menu-toggle {
        display: block;
        right: 15px;
        /* 👉 move button right */
        left: auto;
      }

      /* offcanvas menu */
      .quiz-menu {
        position: fixed;
        top: 0;
        right: -260px;
        /* 👉 start from right */
        left: auto;

        width: 240px;
        height: 100vh;
        background: white;
        padding: 90px 20px;

        flex-direction: column;
        gap: 20px;

        transition: 0.35s;
        box-shadow: -5px 0 20px rgba(0, 0, 0, .3);
        /* 👉 shadow from right */

        z-index: 999;
      }

      /* open state */
      .quiz-menu.open {
        right: 0;
        left: auto;
      }

      /* laptop resize */

      .laptop {
        width: 95vw;
        height: 70vh;
      }


      /* buttons */

      .quiz-btn {
        width: 100%;
        height: 55px;
        font-size: 16px;
        border-radius: 12px;
      }

      .quiz-btn::before {
        display: none;
      }

    }

    @media(max-width:1100px) {

      body {
        overflow: hidden;
        align-items: flex-start;
        padding-top: 60px;
        margin-top: -12px;
      }

      /* ✅ Toggle RIGHT */
      .menu-toggle {
        display: block;
        right: 15px;
        left: auto;
      }

      /* ✅ FIX LAPTOP SCALE */
      .wrapper {
        width: 100%;
      }

      .laptop {
        width: 95vw;
        height: 90vh;
        /* ✅ your desired height */
      }



      /* ✅ OFFCANVAS RIGHT */
      .quiz-menu {
        position: fixed;
        top: 0;

        right: -260px;
        left: auto !important;

        width: 240px;
        height: 100vh;
        background: white;

        padding: 90px 20px;

        display: flex;
        flex-direction: column;
        gap: 20px;

        transition: 0.35s ease;
        box-shadow: -5px 0 20px rgba(0, 0, 0, .3);

        z-index: 999;
      }

      .quiz-menu.open {
        right: 0;
        left: auto !important;
      }

      /* ✅ BUTTON STYLE */
      .quiz-btn {
        width: 100%;
        height: 55px;
        font-size: 16px;
        border-radius: 12px;
      }

      .quiz-btn::before {
        display: none;
      }

    }

    /* Desktop / Monitor */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .wrapper {
        transform: scale(1);
      }
    }

    /* Large Monitors */
    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .wrapper {
        transform: scale(1.3);
        /* 🔥 increase size */
      }
    }

    /* Extra Large Screens / 4K */
    @media screen and (min-width: 1921px) {
      .wrapper {
        transform: scale(1.9);
        /* 🔥 more bigger */
      }
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      display: none;
      z-index: 998;
    }

    .overlay.show {
      display: block;
    }
  </style>
</head>

<body>

  <!-- Mobile Menu Button -->
  <button class="menu-toggle" id="menuToggle">☰</button>
  <div class="overlay" id="overlay"></div>
  <div class="wrapper">

    <div class="laptop">

      <div class="screen">
        <iframe id="frame" src="./exercise/mcq.html"></iframe>
      </div>

    </div>

    <div class="quiz-menu" id="menu">
      <div class="quiz-btn btn1 active" data-file="./exercise/mcq.html">
        <span class="icon">📝</span>
        Choose Option
      </div>

      <div class="quiz-btn btn2" data-file="./exercise/fillintheblanks.html">
        <span class="icon">✏️</span>
        Fill in the Blanks
      </div>

      <div class="quiz-btn btn3" data-file="./exercise/truefalse.html">
        <span class="icon">✔️</span>
        True / False
      </div>

      <div class="quiz-btn btn5" data-file="./exercise/matching.html">
        <span class="icon">🔗</span>
        Matching
      </div>

    </div>

  </div>

  <script>
    const buttons = document.querySelectorAll(".quiz-btn");
    const frame = document.getElementById("frame");
    const menu = document.getElementById("menu");
    const toggle = document.getElementById("menuToggle");
    const overlay = document.getElementById("overlay");

    /* Menu buttons */
    buttons.forEach(btn => {

      btn.addEventListener("click", () => {

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        frame.src = btn.dataset.file;

        /* Close menu on mobile */
        if (window.innerWidth <= 1100) {

          menu.classList.remove("open");
          overlay.classList.remove("show");

        }

      });

    });

    /* Toggle menu */
    toggle.addEventListener("click", () => {

      menu.classList.toggle("open");
      overlay.classList.toggle("show");

    });

    /* Click outside menu */
    overlay.addEventListener("click", () => {

      menu.classList.remove("open");
      overlay.classList.remove("show");

    });
  </script>

</body>

</html>
