<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Image MCQ</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Livvic";
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:clamp(10px, 2vw, 20px);

  /* ✅ FIX: zoom + overflow issue */
  overflow:hidden;
  
}

/* ================= CONTAINER ================= */

.quiz-container{
  width:100%;
  max-width:1400px;
   height:clamp(550px, 80vh, 700px);
   
  position:relative;
  padding-bottom:clamp(80px, 10vh, 120px);
  text-align:left;
  margin-top:-10px;
}

/* ================= QUESTION ================= */

.question{
 font-size:30px;
  min-height:clamp(60px, 10vh, 80px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:left;
  width:100%;
  color:#2f4f4f;
  margin:0 auto;
  margin-top: 10px;
  
}

/* ================= IMAGE ================= */

.question-image{
  display:flex;
  justify-content:center;
  align-items:center;
  height:auto;
  margin-top: -30px;
  
}

.question-image img{
  width: 300px;
  height: 250px;
  object-fit: contain;
}

/* ================= OPTIONS ================= */

.options{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:clamp(10px, 2vw, 20px);
 margin-top: -60px;
}

.option{
  flex:1 1 clamp(120px, 20%, 200px);
  max-width:220px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
   
}

.circle{
  width:clamp(90px, 14vw, 210px);   /* increased */
  height:clamp(90px, 14vw, 210px);
  margin:0 auto 14px;
  border-radius:50%;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  border:1px solid #ffd166;
  transition:0.3s;
}

.circle img{
  width:70%;   /* 🔥 image inside also bigger */
}
.option p{
  padding:clamp(6px, 1vw, 10px) clamp(13px, 2vw, 25px);

  font-size:20px;  /* increased */
font-weight: 400;
  color:#2f4f4f;
  background:#d9e6ec;
  border:2px solid #b7cbd6;
  border-radius:40px;

  box-shadow: 
    inset 0 2px 4px rgba(255,255,255,0.8),
    0 3px 8px rgba(173, 216, 230, 0.25);
}

.option:hover p{
  background:#c8dce6;
  transform:translateY(-2px);
}

/* ================= STATES ================= */
.correct .circle{
  border:3px solid #4caf50;   /* ✅ increased border */
  background:#e8f5e9;
}
.wrong .circle{
  border-color:#f44336;
  background:#ffebee;
}
.nav-container{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
  width:100%;
}

.nav-btn{
  position:static;
}
/* ================= BUTTONS ================= */
/* ============================= */
/* Small Mobile – ensure nav fits */
/* ============================= */
@media screen and (max-width:400px){
  .nav-btn{
    width:100px;
    height:36px;
    font-size:13px;
  }
  .nav-container{
    margin-top:10px;
  }
  .quiz-container{
    padding-bottom:60px;
  }
}

/* ============================= */
/* Mobile with parent toggle visible (481–1100px) */
/* ============================= */
@media screen and (min-width:481px) and (max-width:1100px){
  .question{
    margin-top:50px;
  }
}

/* ===== SAME NAV BUTTON STYLE ===== */

.nav-btn{
   width:150px;
  height:48px;

  border:none;
  border-radius:40px;
  cursor:pointer;
  color:white;

  font-size:18px;
  font-weight:600;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:0.3s;
}

/* Previous */
#prevBtn{
  background:linear-gradient(135deg,#607d8b,#455a64);
}

/* Next */
#nextBtn{
  background:linear-gradient(135deg,#ff9800,#f57c00);
}

/* Hover */
.nav-btn:hover:not(:disabled){
  transform:translateY(-3px);
}

/* Disabled */
.nav-btn:disabled{
  background:#e0e0e0 !important;
  color:#9e9e9e;
  cursor:not-allowed;
  box-shadow:none;
}
/* ================= POPUP ================= */

.popup{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.hidden{
  display:none;
}

.popup-content{
  background:#FFF7F7;
  border:5px solid #FFB4B4;

  box-shadow:
    0 0 0 8px #FFEAEA,
    0 12px 25px rgba(0,0,0,0.10);

  border-radius:35px;    /* soft cream */

  padding:35px 55px;

  border-radius:35px;

 

  text-align:center;

  min-width:280px;
  max-width:450px;


  animation:pop 0.3s ease;
}
.popup-content{
  background:#FCF8FF;
  border:5px solid #D9C2FF;

  box-shadow:
    0 0 0 8px #F3ECFF,
    0 12px 25px rgba(0,0,0,0.10);

  border-radius:35px;
}
@keyframes pop{
  from{ transform:scale(0.8); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}

.popup-emoji{
  font-size:clamp(35px, 5vw, 60px);
  margin-bottom:15px;
}

.popup-content h2{
  font-size:30px;
  margin-bottom:10px;
}

.popup-content p{
  font-size:clamp(18px, 2vw, 28px);
}

/* ================= PLAY AGAIN ================= */

.play-again-btn{
  margin-top:20px;
  padding:clamp(8px, 1vw, 12px) clamp(16px, 2vw, 28px);
  font-size:clamp(14px, 1.2vw, 16px);
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:linear-gradient(135deg,#4caf50,#2e7d32);
  color:white;
  font-weight:600;
  transition:0.3s;
}

.play-again-btn:hover{
  transform:translateY(-3px);
}


/* ================= MOBILE PERFECT FIX ================= */
@media screen and (max-width:480px){

  body{
    overflow:hidden;
    align-items:center;
    padding:10px;
  }

  .quiz-container{
    height:auto;
    min-height:100vh;
    padding-bottom:90px;
    margin-top:0;
  }

  .question{
    font-size:22px;
    line-height:1.2;
    justify-content: center;
    text-align:left;
    align-items: center;
    min-height:auto;
    margin-top: 40px;
  }

  
  .question-image img{
    width:200px;
    height:140px;
    object-fit:contain;
    margin-top: 30px;
  }

  /* Options */
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:-20px;
  }

  .option{
    max-width:none;
  }

  .circle{
    width:90px;
    height:90px;

  }

  .circle img{
    width:65%;
  }

  .option p{
    font-size:14px;
    padding:4px 10px;
    margin-top: -10px;
  }

  .nav-container{
    margin-top:20px;
  }

  .nav-btn{
     width:120px;
    height:40px;
    font-size: 15px;
  }

  #prevBtn{
    left:10px;
  }

  #nextBtn{
    right:10px;
  }

}


/* ============================= */
/* Desktop / Monitor (1025px–1440px) */
/* ============================= */
@media screen and (min-width:1150px) and (max-width:1440px){

  .quiz-container{
    max-width:1400px;
  
  }
 
  /* QUESTION */
  .question{
    font-size:40px;
    min-height:90px;
    margin-top: -10px;
    margin-inline: 40px;
  }

  /* IMAGE */
  .question-image img{
    width:400px;
    margin-top: 30px;
    
  }

  /* OPTIONS */
  .options{
    gap:18px;
    
  }

  .circle{
    width:150px;
    height:150px;
  }

  .circle img{
    width:60%;
  }

  .option p{
    font-size:22px;
    padding:8px 18px;
  }
  .nav-container{
    width: 90%;
    margin-left: 30px;
  }
  /* BUTTONS */
  .nav-btn{
    bottom:20px;
    width:160px;
    height:65px;
    font-size: 28px;
  }

}

/* ============================= */
/* Large Monitors (1441px–1920px) */
/* ============================= */
@media screen and (min-width:1441px) and (max-width:1920px){

  .quiz-container{
    max-width:1300px;
  }

  /* QUESTION */
  .question{
    font-size:40px;   /* 🔥 bigger */
    min-height:110px;
  }

  /* IMAGE */
  .question-image img{
    width:380px;
  }

  /* OPTIONS */
  .options{
    gap:25px;
  }

  .circle{
    width:200px;
    height:200px;
  }

  .circle img{
    width:80%;
  }

  .option p{
    font-size:28px;
    padding:14px 28px;
  }

  /* BUTTONS */
  .nav-btn{
    font-size:20px;
    width:160px;
    height:65px;
   
  }

}

/* ============================= */
/* Extra Large Screens / 4K (1921px+) */
/* ============================= */
@media screen and (min-width:1921px){

  .quiz-container{
    max-width:1500px;
  }

  /* QUESTION */
  .question{
    font-size:40px;
    min-height:130px;
  }

  /* IMAGE */
  .question-image img{
    width:450px;
  }

  /* OPTIONS */
  .options{
    gap:30px;
  }

  .circle{
    width:240px;
    height:240px;
  }

  .circle img{
    width:85%;
  }

  .option p{
    font-size:34px;
    padding:18px 36px;
  }

  /* BUTTONS */
  .nav-btn{
    font-size:26px;
    padding:16px 42px;
  }

}

/* ========================= */
/* Small Mobile (320px-375px) */
/* ========================= */
@media (max-width:600px){

  .popup-content{
    width:85%;
    max-width:250px;
    min-width:220px;

    padding:16px 18px;

    border:4px solid #D9C2FF;

    box-shadow:
      0 0 0 5px #F3ECFF,
      0 8px 18px rgba(0,0,0,0.08);

    border-radius:25px;
  }

  .popup-emoji{
    font-size:32px;
    margin-bottom:5px;
  }

  .popup-content h2{
    font-size:18px;
    margin-bottom:4px;
  }

  .popup-content p{
    font-size:14px;
    line-height:1.3;
  }

  .play-again-btn{
    margin-top:10px;
    padding:8px 16px;
    font-size:13px;
    border-radius:20px;
  }

}
/* ========================= */
/* TABLET (768px - 1024px) */
/* ========================= */



</style>
</head>

<body>

<div class="quiz-container">

  <div class="question" id="question"></div>

<div class="question-image">
  <img id="questionImg" src="">
</div>
  <div class="options" id="options"></div>
<div class="nav-container">
  <button class="nav-btn" id="prevBtn">← Prev</button>
  <button class="nav-btn" id="nextBtn" disabled>Next →</button>
</div>
 <!-- Popup -->
<div id="popup" class="popup hidden">
 <div class="popup-content">
  <div id="popupEmoji" class="popup-emoji"></div>
  <h2 id="popupTitle"></h2>
  <p id="popupMessage"></p>

  <button id="playAgainBtn" class="play-again-btn hidden">
    🔄 Play Again
  </button>
</div>
</div>

</div>


<script>
const questions = [
  {
    question: "Q1. The ______ help a plant to absorb water and minerals from the soil.",
    image: "../images/mcq1.png",
    options: [
      { text: "Leaves", img: "../images/leaf.png" },
      { text: "Stem", img: "../images/stems.png" },
      { text: "Roots", img: "../images/roots.png" },
      { text: "Flower", img: "../images/flowerak.png" }
    ],
    correct: 2
  },
  {
    question: "Q2. The ______ bears the leaves.",
    image: "../images/mcq22.png",

    options: [
      { text: "Root", img: "../images/roots.png" },
      { text: "Stem", img: "../images/stems.png" },
      { text: "Fruit", img: "../images/Fruits.png" },
      { text: "Flower", img: "../images/flowerak.png" }
    ],
    correct: 1
  },
  {
    question: "Q3. The ______ of the ginger stores extra food.",
    image: "../images/ginger.png",
    options: [
      { text: "Root", img: "../images/roots.png" },
      { text: "Leaf", img: "../images/leaf.png" },
      { text: "Fruit", img: "../images/Fruits.png" },
      { text: "Stem", img: "../images/stems.png" }
    ],
    correct: 3
  },
  {
    question: "Q4. The ______ is the most beautiful part of a plant.",
    image: "../images/mcq44.png",
    options: [
      { text: "Stem", img: "../images/stems.png" },
      { text: "Leaf", img: "../images/leaf.png" },
      { text: "Fruit", img: "../images/Fruits.png" },
      { text: "Flower", img: "../images/flowerak.png" }
    ],
    correct: 3
  },
  {
    question: "Q5. A ______ plant has taproot.",
    image: "../images/mcq5.png",
    options: [
      { text: "Paddy", img: "../images/paddy.png" },
      { text: "Wheat", img: "../images/Wheat1.png" },
      { text: "Onion", img: "../images/onion1.png" },
      { text: "Mango", img: "../images/Mango.png" }
    ],
    correct: 3
  }
];
let currentQuestion = 0;
let selectedAnswers = new Array(questions.length).fill(null);

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popupTitle");
const popupMessage = document.getElementById("popupMessage");
const popupEmoji = document.getElementById("popupEmoji");
const playAgainBtn = document.getElementById("playAgainBtn");

const questionImg = document.getElementById("questionImg");

/* ===== TEXT TO SPEECH (UK) ===== */
function speakText(t) {
  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(t);

  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;

  speechSynthesis.speak(msg);
}
window.speechSynthesis.onvoiceschanged = () => {};

function fireConfetti(){

  confetti({
    particleCount: 40,   // small confetti
    spread: 70,
    origin: { y: 0.6 },
    scalar: 0.7
  });

}
function fireFinalConfetti(){

  const duration = 2500;
  const animationEnd = Date.now() + duration;

  const interval = setInterval(function () {

    if (Date.now() > animationEnd) {
      clearInterval(interval);
      return;
    }

    confetti({
      particleCount: 60,
      spread: 120,
      startVelocity: 45,
      scalar: 1.1,
      origin: { x: Math.random(), y: Math.random() - 0.2 }
    });

  }, 250);

}
function loadQuestion(){
  optionsEl.innerHTML = "";

  const q = questions[currentQuestion];
  questionEl.textContent = q.question;

  questionImg.src = q.image;

  // Disable next by default
  nextBtn.disabled = selectedAnswers[currentQuestion] !== q.correct;

  q.options.forEach((opt,index)=>{
    const div = document.createElement("div");
    div.classList.add("option");

    div.innerHTML = `
      <div class="circle">
        <img src="${opt.img}">
      </div>
      <p>${opt.text}</p>
    `;
div.addEventListener("click",()=>{

  // prevent editing after correct answer
  if(selectedAnswers[currentQuestion] === q.correct){
    return;
  }

  // Prevent clicking again if correct answer already selected
  if(selectedAnswers[currentQuestion] === q.correct){
    return;
  }

  selectedAnswers[currentQuestion] = index;

  // Reload to update highlight
  loadQuestion();

  if(index === q.correct){

  fireConfetti(); // 🎉 confetti effect

  popupEmoji.textContent = "🎉";
    popupTitle.textContent = "Correct!";
    popupTitle.style.color = "green";
    popupMessage.textContent = "Great job!";
    nextBtn.disabled = false;

    speakText("Correct!");

    popup.classList.remove("hidden");

    // ✅ If this is LAST question → show final popup automatically
    if(currentQuestion === questions.length - 1){

      setTimeout(()=>{
        popup.classList.add("hidden");   // hide correct popup first
        showFinalPopup();               // then show final popup
      },1200);

    } else {

      // Hide normal correct popup after delay
      setTimeout(()=>{
        popup.classList.add("hidden");
      },1200);
    }

  } else {

    popupEmoji.textContent = "❌";
    popupTitle.textContent = "Wrong!";
    popupTitle.style.color = "red";
    popupMessage.textContent = "Try again!";
    nextBtn.disabled = true;

    speakText("Wrong!");

    popup.classList.remove("hidden");

    setTimeout(()=>{
      popup.classList.add("hidden");
    },1200);
  }

});
    // Restore selection highlight
if(selectedAnswers[currentQuestion] !== null){
  if(index === selectedAnswers[currentQuestion]){
    if(index === q.correct){
      div.classList.add("correct");
    } else {
      div.classList.add("wrong");
    }
  }
}

    optionsEl.appendChild(div);
  });

  prevBtn.disabled = currentQuestion === 0;
}

nextBtn.addEventListener("click",()=>{
  if(currentQuestion < questions.length - 1){
    currentQuestion++;
    loadQuestion();
  } else {
    showFinalPopup();
  }
});

prevBtn.addEventListener("click",()=>{
  if(currentQuestion > 0){
    currentQuestion--;
    loadQuestion();
  }
});
function showFinalPopup(){

  let score = 0;

  questions.forEach((q,i)=>{
    if(selectedAnswers[i] === q.correct){
      score++;
    }
  });
fireFinalConfetti(); 
  popupEmoji.textContent = "🏆";
  popupTitle.textContent = "Quiz Completed!";

  if(score === 5){
    popupTitle.style.color = "#2e7d32";  // dark green
    popupMessage.style.color = "#2e7d32";
    popupMessage.textContent = `Score: ${score}/5 - Excellent 🌟`;
  }
  else if(score > 3){
    popupTitle.style.color = "#1565c0";  // blue
    popupMessage.style.color = "#1565c0";
    popupMessage.textContent = `Score: ${score}/5 - Very Good 👏`;
  }
  else if(score < 3){
    popupTitle.style.color = "#c62828";  // red
    popupMessage.style.color = "#c62828";
    popupMessage.textContent = `Score: ${score}/5 - Keep Practicing 💪`;
  }
  else{
    popupTitle.style.color = "#ef6c00";  // orange
    popupMessage.style.color = "#ef6c00";
    popupMessage.textContent = `Score: ${score}/5 - Good 👍`;
  }

  playAgainBtn.classList.remove("hidden");
popup.classList.remove("hidden");
}

playAgainBtn.addEventListener("click",()=>{
  location.reload();
});
loadQuestion();
</script>

</body>
</html>
