
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>True False Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

/* ===== BASE ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Livvic';
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* ===== CONTAINER ===== */

.quiz-container{
width:100%;
max-width:clamp(600px, 90vw, 900px);

padding:clamp(20px,4vw,40px) clamp(15px,3vw,30px) clamp(80px,12vh,120px);
text-align:center;
position:relative;
}

/* ===== QUESTION ===== */

.question{
font-size:30px;
margin-top:clamp(-30px, -3vh, -40px);
color:#2f4f4f;
display: flex;
justify-content: center;
align-items: center;
text-align: left;
}

/* ===== IMAGE ===== */
.image{
  display:flex;
  justify-content:center;
  align-items:center;

height: 160px;

  margin-block:clamp(20px,4vh,35px);
}

.image img{

  width: 180px;

  height: 180px;

  object-fit:contain;

}

.options{
display:flex;
justify-content:center;
gap:clamp(20px,5vw,50px);
margin-top:clamp(5px,2vh,10px);
}

/* ===== OPTION BUTTON ===== */

.option-btn{
display:flex;
align-items:center;
justify-content:center;
gap:clamp(8px,2vw,12px);

padding:clamp(12px,2vh,18px) clamp(25px,5vw,50px);

font-size:clamp(20px,2vw,28px);
font-weight:600;

border-radius:60px;
cursor:pointer;
color:#ffffff;
position:relative;
transition:0.25s;

/* box-shadow:0 clamp(8px,2vh,12px) clamp(12px,3vh,20px) rgba(0,0,0,0.2); */
}

/* INNER SHINE */

.option-btn::after{
content:"";
position:absolute;
top:4px;
left:8px;
right:8px;
height:45%;
border-radius:60px;
/* background:linear-gradient(rgba(255,255,255,0.6),rgba(255,255,255,0)); */
pointer-events:none;
}

/* HOVER */

.option-btn:hover{
transform:translateY(-4px);
}

/* TRUE */

.true-btn{
background:linear-gradient(180deg,#8edb7f,#8be88b);
/* box-shadow:
inset 0 2px 6px rgba(255,255,255,0.6),
0 clamp(8px,2vh,12px) clamp(12px,3vh,18px) rgba(0,0,0,0.2); */
}

/* FALSE */

.false-btn{
background:linear-gradient(180deg,#ff8e8e,#e07171);
/* box-shadow:
inset 0 2px 6px rgba(255,255,255,0.6),
0 clamp(8px,2vh,12px) clamp(12px,3vh,18px) rgba(0,0,0,0.2); */
}

/* SELECTED */

.selected{
transform:scale(1.05);
box-shadow:
0 0 0 4px rgba(37, 109, 42, 0.6),
0 clamp(10px,3vh,22px) clamp(15px,4vh,22px) rgba(0,0,0,0.25);
}

/* ===== NAV BUTTON ===== */
/* ===== SAME NAV BUTTON STYLE ===== */

.nav-btn{
  width:150px;
  height:48px;
  border:none;
  border-radius:30px;
  cursor:pointer;

   font-size:18px;
  font-weight:600;

  color:white;
  transition:.3s;

  display:flex;
  align-items:center;
  justify-content:center;

  position:absolute;
  bottom:25px;
}

/* Previous */
#prevBtn{
  left:30px;
  background:linear-gradient(135deg,#607d8b,#455a64);
}

/* Next */
#nextBtn{
  right:30px;
  background:linear-gradient(135deg,#ff9800,#f57c00);
}

/* Hover */
.nav-btn:hover:not(:disabled){
  transform:scale(1.05);
}

.nav-btn:disabled{
  background:#dcdcdc !important;
  color:#888;
  box-shadow:none;
  cursor:not-allowed;
}

/* ===== POPUP ===== */

.popup{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
}

.hidden{
display:none;
}

.popup-content{
  background:#ffffff;

  padding:40px 70px;

  border-radius:40px;

  border:4px solid #BDE7FF;

  box-shadow:
    0 0 0 8px #EAF6FF,
    0 12px 30px rgba(0,0,0,0.12);

  text-align:center;

  min-width:320px;
  max-width:500px;
}

.popup-emoji{
 font-size:clamp(30px,6vw,60px);
margin-bottom:15px;
}

.popup-content h2{
font-size:clamp(20px,2vw,28px);
margin-bottom:10px;
}

.popup-content p{
font-size:clamp(14px,2vw,20px);
}

.popup-emoji{
  font-size:clamp(30px,6vw,60px);
  margin-bottom:15px;
}

.popup-content h2{
  font-size:clamp(18px,3vw,28px);
}


.play-again-btn{
margin-top:20px;
  padding:10px 25px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:linear-gradient(135deg,#4caf50,#2e7d32);
  color:white;
}

/* ===== MOBILE ===== */

.image img{
max-width:clamp(140px,40vw,180px);
}

.options{
gap:clamp(15px,4vw,20px);
}

.option-btn{
font-size:clamp(18px,2vw,22px);
padding:clamp(12px,2vh,15px) clamp(20px,4vw,35px);
}


@media (max-width:480px){

  body{
    overflow:hidden;
    align-items:flex-start;
    padding-top:20px;
    margin-top:70px;
  }

  .quiz-container{
    padding:10px 10px 90px;
  }

  .question{
   
    font-size:22px;
    line-height:1.4;
    margin-top:0;
    margin-bottom:10px;
  }

  .image{
    display:flex;
    justify-content:center;
    align-items:center;
    height:auto;
    min-height:150px;
    margin-top:5px;
    margin-bottom:10px;
  }

  .image img{
    width:280px;
    height:200px;
    max-height:280px;
    object-fit:contain;
  }

  .options{
    margin-top:5px;
    gap:55px;
    flex-wrap:wrap;
  }

  .option-btn{
    font-size:18px;
    padding:12px 24px;
  }

  .nav-btn{
    width:120px;
    height:40px;
    font-size: 15px;
    padding: 0 12px;
    margin-bottom: -40px;
  }

  #prevBtn{
    left:10px;
  }

  #nextBtn{
    right:10px;
  }

  .popup-content{
    width:90%;
    padding:25px 20px;
  }

}


/* ✅ Desktop only bigger image */
@media (min-width: 900px){
  .image img{
    width: clamp(260px, 20vw, 380px);  /* 🔥 increased size */
  }
}


/* ============================= */
/* Desktop / Monitor (1025px–1440px) */
/* ============================= */
@media screen and (min-width:1125px) and (max-width:1440px){

  .quiz-container{
    max-width:1000px;
  }

  /* QUESTION */
  .question{
    font-size:40px;
  }

  
  /* IMAGE */
  .image{
    height:320px;
  }

  .image img{
    width:340px;
    height:320px;
  }


  /* TRUE / FALSE BUTTON */
  .options{
    gap:60px;
  }

  .option-btn{
    font-size:34px;        /* 🔥 big text */
    padding:25px 70px;     /* 🔥 big size */
    border-radius:70px;
  }

  /* NAV BUTTON */
  .nav-btn{
    width:160px;
    height:65px;
    font-size: 28px;
  }

}

/* ============================= */
/* Large Monitors (1441px–1920px) */
/* ============================= */
@media screen and (min-width:1441px) and (max-width:1920px){

  .quiz-container{
    max-width:1200px;
  }

  /* QUESTION */
  .question{
    font-size:40px;   /* 🔥 bigger */
  }

  /* IMAGE */
  .image{
    height:360px;
  }

  .image img{
    width:340px;
    height:320px;
  }

  /* TRUE / FALSE BUTTON */
  .options{
    gap:60px;
  }

  .option-btn{
    font-size:34px;        /* 🔥 big text */
    padding:25px 70px;     /* 🔥 big size */
    border-radius:70px;
  }

  /* NAV BUTTON */
  .nav-btn{
    width:180px;
    height:60px;
    font-size:22px;
  }

}

/* ============================= */
/* Extra Large Screens / 4K (1921px+) */
/* ============================= */
@media screen and (min-width:1921px){

  .quiz-container{
    max-width:1400px;
  }

  /* QUESTION */
  .question{
    font-size:40px;
  }

  /* IMAGE */
  .image{
    height:420px;
  }

  .image img{
    width:420px;
    height:380px;
  }

  /* TRUE / FALSE BUTTON */
  .options{
    gap:80px;
  }

  .option-btn{
    font-size:40px;
    padding:30px 90px;   /* 🔥 very big */
  }

  /* NAV BUTTON */
  .nav-btn{
    width:200px;
    height:70px;
    font-size:26px;
  }

}


    @media (max-width:600px){

  .popup-content{
    width:70%;
    min-width:auto;
    max-width:280px;

    padding:18px 20px;

    border-radius:28px;

    border:3px solid #BDE7FF;

    box-shadow:
      0 0 0 5px #EAF6FF,
      0 8px 20px rgba(0,0,0,0.10);
  }

  .popup-emoji{
    font-size:36px;
    margin-bottom:6px;
  }

  .popup-content h2{
    font-size:20px;
    margin-bottom:4px;
  }

  .popup-content p{
    font-size:14px;
  }

  .play-again-btn{
    margin-top:12px;
    padding:8px 18px;
    font-size:14px;
  }
  

}


</style>
</head>

<body>

<div class="quiz-container">



<div class="question" id="question"></div>

<div class="image">
<img id="questionImg">
</div>

<div class="options">
<div class="option-btn true-btn" onclick="selectAnswer('T')">✔ TRUE</div>
<div class="option-btn false-btn" onclick="selectAnswer('F')">✖ FALSE</div>
</div>

<button class="nav-btn" id="prevBtn">← Prev</button>
  <button class="nav-btn" id="nextBtn" disabled>Next →</button>

</div>


<!-- POPUP -->

<div id="popup" class="popup hidden">

<div class="popup-content">

<div id="popupEmoji" class="popup-emoji"></div>

<h2 id="popupTitle"></h2>

<p id="popupMessage"></p>

<button id="playAgainBtn" class="play-again-btn hidden">
🔄 Play Again
</button>

</div>

</div>


<script>

const questions = [

{q:"Q1. Insects are non-living things.", img:"../images/insects.png", correct:"F"},

{q:"Q2. Plants do not respond to stimuli.", img:"../images/plant1.png", correct:"F"},

{q:"Q3. Living things don’t die.", img:"../images/Mango.png", correct:"F"},

{q:"Q4. Frogs and insects lay eggs.", img:"../images/mcq2.png", correct:"T"},

{q:"Q5. The lifespan of different living things vary.", img:"../images/tf55.png", correct:"T"}
  
];


let current = 0;

let selectedAnswers = new Array(questions.length).fill(null);


const questionEl = document.getElementById("question");

const imgEl = document.getElementById("questionImg");

const nextBtn = document.getElementById("nextBtn");

const prevBtn = document.getElementById("prevBtn");


const popup = document.getElementById("popup");

const popupTitle = document.getElementById("popupTitle");

const popupMessage = document.getElementById("popupMessage");

const popupEmoji = document.getElementById("popupEmoji");

const playAgainBtn = document.getElementById("playAgainBtn");

const trueBtn = document.querySelector(".true-btn");
const falseBtn = document.querySelector(".false-btn");


function speak(t) {
  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(t);

  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;

  speechSynthesis.speak(msg);
}

function fireConfetti(){

  confetti({
    particleCount: 40,
    spread: 70,
    origin: { y: 0.6 },
    scalar: 0.7
  });

}
/* LOAD QUESTION */

function loadQuestion(){

const q = questions[current];

questionEl.textContent = q.q;
imgEl.src = q.img;

trueBtn.classList.remove("selected");
falseBtn.classList.remove("selected");

/* highlight previous answer */

if(selectedAnswers[current] === "T"){
trueBtn.classList.add("selected");
}

if(selectedAnswers[current] === "F"){
falseBtn.classList.add("selected");
}

nextBtn.disabled = selectedAnswers[current] === null;
prevBtn.disabled = current === 0;

}

/* SELECT ANSWER */

function selectAnswer(choice){

if(selectedAnswers[current] !== null) return;

const correctAnswer = questions[current].correct;


if(choice === correctAnswer){
  fireConfetti(); // 🎉 same confetti as MCQ

selectedAnswers[current] = choice;
if(choice === "T"){
trueBtn.classList.add("selected");
}
if(choice === "F"){
falseBtn.classList.add("selected");
}

nextBtn.disabled = false;


popupEmoji.textContent = "🎉";

popupTitle.textContent = "Correct!";

popupTitle.style.color = "green";

popupMessage.textContent = "Great job!";

playAgainBtn.classList.add("hidden");


speak("Correct");


popup.classList.remove("hidden");


if(current === questions.length-1){

setTimeout(()=>{

popup.classList.add("hidden");

showFinalPopup();

},1200);

}

else{

setTimeout(()=>popup.classList.add("hidden"),1200);

}

}

else{

popupEmoji.textContent = "❌";

popupTitle.textContent = "Wrong!";

popupTitle.style.color = "red";

popupMessage.textContent = "Try again!";

playAgainBtn.classList.add("hidden");


speak("Wrong");


popup.classList.remove("hidden");

setTimeout(()=>popup.classList.add("hidden"),1200);

}

}


/* NEXT */

nextBtn.addEventListener("click",()=>{

if(current < questions.length-1){

current++;

loadQuestion();

}

});


/* PREVIOUS */

prevBtn.addEventListener("click",()=>{

if(current > 0){

current--;

loadQuestion();

}

});


/* FINAL SCORE */

function showFinalPopup(){

let score = 0;

questions.forEach((q,i)=>{

if(selectedAnswers[i] === q.correct) score++;

});


popupEmoji.textContent = "🏆";

popupTitle.textContent = "Quiz Completed!";
popupTitle.style.color = "#2e7d32";
    popupMessage.style.color = "#2e7d32";
popupMessage.textContent = `Score: ${score}/5`;

playAgainBtn.classList.remove("hidden");

popup.classList.remove("hidden");
confetti({
  particleCount:150,
  spread:120,
  origin:{ y:0.6 }
});


}


/* PLAY AGAIN */

playAgainBtn.addEventListener("click",()=>{

current = 0;

selectedAnswers = new Array(questions.length).fill(null);

popup.classList.add("hidden");

playAgainBtn.classList.add("hidden");


loadQuestion();

});


loadQuestion();

</script>

</body>
</html>
