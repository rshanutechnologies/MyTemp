<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Assessment Viewer</title>

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Livvic', sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* WRAPPER */

    .wrapper {
      width: 100%;
      height: 100vh;
      padding: 0;
    }

    /* FRAME */

    .frame {
      width: 100%;
      height: 100%;

      background-image: url("assets/images/BG-O.png");

      background-size: 4px 4px;
      background-position: center;

      /* border:12px solid #c69052; */

      box-shadow:
        inset 0 0 10px rgba(0, 0, 0, 0.35),
        0 15px 40px rgba(0, 0, 0, 0.35);

      display: flex;
      flex-direction: column;

      padding: 10px;
      border-radius: 30px;
      position: relative;
    }

    /* NAVBAR */

    .top-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 10px;
    }

    /* NAV BUTTON */

    .nav-btn {
      padding: 12px 26px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;

      box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.25),
        inset 0 2px 4px rgba(255, 255, 255, 0.4);

      transition: 0.2s;
      opacity: 0.45;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
    }

    /* COLORS */

    .mcq {
      background: linear-gradient(#8fc3eb, #5aa3d6);
      color: white;
    }

    .fill {
      background: linear-gradient(#ffc86d, #f3a83e);
      color: white;
    }

    .true {
      background: linear-gradient(#8ed681, #4caf50);
      color: white;
    }

    .two {
      background: linear-gradient(#f7a6e3, #db5ec1);
      color: white;
    }

    .match {
      background: linear-gradient(#ffd76a, #f4b52c);
      color: white;
    }

    /* ACTIVE BUTTON */

    .nav-btn.active {
      outline: 3px solid white;

      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.15),
        0 6px 12px rgba(0, 0, 0, 0.25),
        inset 0 2px 4px rgba(255, 255, 255, 0.5);

      transform: scale(1.05);

      opacity: 1;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .nav-btn.active::before {
      content: "✔";

      width: 18px;
      height: 18px;

      background: #2ecc71;
      color: white;

      font-size: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      box-shadow:
        0 0 6px rgba(46, 204, 113, 0.8),
        0 0 12px rgba(46, 204, 113, 0.6),
        0 0 18px rgba(46, 204, 113, 0.4);
    }

    /* CONTENT */

    .content {
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: transparent;
      border-radius: 12px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* MENU BUTTON */

    .menu-btn {
      display: none;

      position: absolute;
      top: 10px;
      right: 10px;

      font-size: 24px;

      background: #333;
      color: white;

      border: none;
      border-radius: 6px;

      padding: 6px 12px;
      cursor: pointer;
      z-index: 1000;
    }

    /* ===========================
   320px - 767px MOBILE
=========================== */

    @media screen and (max-width:767px) {

      .frame {
        border-width: 6px;
        padding-top: 55px;
      }

      .menu-btn {
        display: block;
      }

      .top-nav {
        display: none;
        flex-direction: column;

        position: absolute;
        top: 60px;
        left: 10px;

        width: 230px;

        background: white;

        padding: 15px;

        border-radius: 10px;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);

        gap: 10px;
        z-index: 999;
      }

      .top-nav.show {
        display: flex;
      }

      .nav-btn {
        width: 100%;
        font-size: 14px;
        padding: 10px;
      }

    }

    /* ===========================
   768px - 1023px TABLET
=========================== */

    @media screen and (min-width:768px) and (max-width:1023px) {

      .menu-btn {
        display: none;
      }

      .top-nav {
        display: flex !important;
        gap: 12px;
      }

      .nav-btn {
        font-size: 15px;
        padding: 10px 18px;
      }

      .frame {
        border-width: 8px;
      }

    }

    /* ===========================
   1024px - 1439px LAPTOP
=========================== */

    @media screen and (min-width:1024px) and (max-width:1439px) {

      .frame {
        border-width: 12px;
      }

      .top-nav {
        gap: 14px;
      }

      .nav-btn {
        font-size: 16px;
        padding: 10px 22px;
      }

    }

    /* ===========================
   1440px - 1919px DESKTOP
=========================== */

    @media screen and (min-width:1440px) and (max-width:1919px) {

      .frame {
        border-width: 18px;
        padding: 14px;
      }

      .top-nav {
        gap: 18px;
      }

      .nav-btn {
        font-size: 22px;
        padding: 14px 28px;
      }

    }

    /* ===========================
   1920px+ LARGE SCREENS
=========================== */

    @media screen and (min-width:1920px) {

      .frame {
        border-width: 24px;
        padding: 18px;
      }

      .top-nav {
        gap: 24px;
      }

      .nav-btn {
        font-size: 28px;
        padding: 16px 34px;
        border-radius: 40px;
      }

    }
  </style>
</head>

<body>

  <div class="wrapper">

    <div class="frame">

      <button class="menu-btn" onclick="toggleMenu()">☰</button>

      <div class="top-nav" id="navbar">

        <button class="nav-btn mcq active" onclick="openPage('exercises/MCQ.html',this)">MCQ's</button>

        <button class="nav-btn fill" onclick="openPage('exercises/FITB.html',this)">Fill in the Blanks</button>

        <button class="nav-btn true" onclick="openPage('exercises/True_false.html',this)">True / False</button>

        <!-- <button class="nav-btn two" onclick="openPage('exercises/oneExample.html',this)">One Example</button> -->

        <button class="nav-btn match" onclick="openPage('exercises/matching.html',this)">Matching</button>

      </div>

      <div class="content">

        <iframe id="viewer" src="exercises/MCQ.html"></iframe>

      </div>

    </div>

  </div>

  <script>

    function openPage(page, btn) {

      document.getElementById("viewer").src = page;

      document.querySelectorAll(".nav-btn").forEach(b => {
        b.classList.remove("active");
      });

      btn.classList.add("active");

      /* close mobile menu */

      document.getElementById("navbar").classList.remove("show");

    }

    function toggleMenu() {

      document.getElementById("navbar").classList.toggle("show");


    }
    /* CLOSE WHEN CLICK ANYWHERE */
    document.addEventListener("click", function () {
      document.getElementById("navbar").classList.remove("show");
    });

    /* PREVENT CLOSE WHEN CLICKING MENU BUTTON */
    document.querySelector(".menu-btn").addEventListener("click", function (e) {
      e.stopPropagation();
    });

    /* PREVENT CLOSE WHEN CLICKING INSIDE NAV */
    document.getElementById("navbar").addEventListener("click", function (e) {
      e.stopPropagation();
    });

    /* CLOSE WHEN CLICKING INSIDE IFRAME */
    const iframe = document.getElementById("viewer");

    iframe.addEventListener("load", function () {
      iframe.contentWindow.document.addEventListener("click", function () {
        document.getElementById("navbar").classList.remove("show");
      });
    });
  </script>

</body>

</html>
