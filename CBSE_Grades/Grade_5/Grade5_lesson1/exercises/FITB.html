<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fill in the Blanks - For Kids</title>

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="../assets/css/FITB.css">
</head>

<body>

  <div class="quiz">

    <div class="main-content">

      <!-- 1. QUESTION (top) - plain text with ______ -->
      <div class="question-area">
        <div class="question" id="question"></div>
      </div>

      <!-- 2. IMAGE (below question) -->
      <div class="image-container">
        <img id="questionImage" src="" alt="Question illustration">
      </div>

      <!-- 3. INPUT + CHECK INLINE (below image) -->
      <div class="input-area">
        <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer..." autocomplete="off" />
        <button class="checkBtn" id="checkBtn" disabled>Check</button>
      </div>

      <!-- 4. NAVIGATION (below check button) -->
      <div class="nav">
        <button class="prev" id="prev" disabled>← Prev</button>
        <button class="next" id="next" disabled>Next →</button>
      </div>

    </div>

  </div>

  <!-- Popup -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <div class="popup-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <!-- Final Score -->
  <div id="final" class="final">
    <h2>🎉 Congratulations!</h2>
    <h3 id="score"></h3>
    <div>
      <span class="star">★</span>
      <span class="star">★</span>
      <span class="star">★</span>
      <span class="star">★</span>
      <span class="star">★</span>
    </div>
    <button class="playBtn" onclick="playAgain()">Play Again</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
  </script>
<script src="../assets/js/FITB.js"></script>

</body>

</html>
